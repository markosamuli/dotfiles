---
name: check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install shell tools (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck shfmt

      - name: Install shell tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt zsh

      - uses: astral-sh/setup-uv@v10

      - name: Run pre-commit hooks
        run: >-
          uvx --with-requirements requirements.dev.txt pre-commit
          run --all-files --show-diff-on-failure

      - name: Check shell startup
        run: make check-startup
